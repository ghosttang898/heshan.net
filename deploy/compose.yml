name: heshan
services:
  db:
    image: postgres:16-bookworm
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
      APP_DB_USER: ${POSTGRES_USER:?required}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, shared_buffers=64MB, -c, work_mem=2MB, -c, maintenance_work_mem=32MB, -c, max_connections=20, -c, log_statement=none, -c, log_min_error_statement=panic]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./postgres-init.sh
        target: /docker-entrypoint-initdb.d/10-app-user.sh
        read_only: true
        bind: {create_host_path: false}
    networks: [database]
    mem_limit: 384m
    cpus: 0.35
    pids_limit: 100
    shm_size: 64m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${APP_DB_USER}" -d "$${POSTGRES_DB}"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  backend:
    image: ${BACKEND_IMAGE:?prebuilt backend image required}
    pull_policy: never
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?required}
      DB_USER: ${POSTGRES_USER:?required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?required}
      APP_GEOLOCATION_TRUSTED_PROXIES: 172.30.10.10/32
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC -Xms128m -Xmx320m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=32m -XX:+ExitOnOutOfMemoryError
    depends_on:
      db: {condition: service_healthy}
    expose: ["8080"]
    networks: [database, application]
    mem_limit: 768m
    cpus: 0.60
    pids_limit: 120
    read_only: true
    tmpfs:
      - "/tmp:size=64m,mode=1777"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "4", http://127.0.0.1:8080/actuator/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *logging
  proxy:
    image: nginx:stable-alpine
    pull_policy: never
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: {create_host_path: false}
    networks:
      application: {ipv4_address: 172.30.10.10}
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 64m
    cpus: 0.10
    pids_limit: 40
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
  offsite:
    profiles: [backup]
    image: rclone/rclone:1.70.3
    entrypoint: [/bin/sh, -ec]
    command:
      - 'test -n "$${BACKUP_REMOTE}" && rclone copy /backups "$${BACKUP_REMOTE}" --include "heshan-*.dump*" --config /config/rclone.conf --quiet'
    environment:
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
    volumes:
      - type: bind
        source: ${BACKUP_DIR:-/var/backups/heshan}
        target: /backups
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RCLONE_CONFIG:-/etc/heshan/rclone.conf}
        target: /config/rclone.conf
        read_only: true
        bind: {create_host_path: false}
    networks: [offsite]
    mem_limit: 128m
    cpus: 0.20
    pids_limit: 40
    logging: *logging
volumes:
  postgres_data:
networks:
  database:
    internal: true
  application:
    ipam:
      config: [{subnet: 172.30.10.0/24}]
  offsite:
