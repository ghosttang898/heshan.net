events { worker_connections 256; }
http {
    # Do not log request paths, query strings, JWTs, or client IP addresses.
    access_log off;
    error_log /dev/stderr crit;
    server {
        listen 80;
        client_max_body_size 32k;
        # Loopback-published ingress accepts forwarding from a future trusted
        # host TLS proxy only. That proxy must overwrite X-Forwarded-For.
        set_real_ip_from 172.30.10.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive off;
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            # This loopback ingress is used only behind the host HTTPS proxy.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location / { return 404; }
    }
}
