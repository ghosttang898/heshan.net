spring.application.name=tonghehui-backend
spring.h2.console.enabled=false
spring.datasource.url=jdbc:h2:mem:tonghehui;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.jwt.secret=${APP_JWT_SECRET:TongHeHuiSecretKeyTongHeHuiSecretKey1234567890}
app.jwt.expiration-ms=86400000
# Resolve forwarding only against explicitly configured socket peers.
server.forward-headers-strategy=none
app.geolocation.database-path=${APP_GEOLOCATION_DATABASE_PATH:}
app.geolocation.trusted-proxies=${APP_GEOLOCATION_TRUSTED_PROXIES:}
app.geolocation.timeout-ms=${APP_GEOLOCATION_TIMEOUT_MS:200}
